# x-livespaces Cloudflare Worker (OpenNext).
# Coordinator fills KV ids at deploy. Do not invent account or namespace IDs.
# No Workers edge runtime key. Node.js via nodejs_compat.

name = "x-livespaces"
main = ".open-next/worker.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Directory snapshot (S26): key snapshot:v1. Soft TTL is generatedAt in app code.
[[kv_namespaces]]
binding = "LIVE_DIRECTORY"
id = "4dbf7012107e4cb694ff13f07e13380f"
preview_id = "6370af6feb73491ba44ea95dda268cec"

# OpenNext incremental cache — NEVER the same namespace as LIVE_DIRECTORY.
[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "82a12937ee074a49b1460fab38fe295b"
preview_id = "67e2d239ee8a42a492bbfec426538c0e"

# GET /api/spaces rate limiting (60 req / 60s per IP) is enforced in-worker via
# a LIVE_DIRECTORY KV fixed window (src/lib/http/get-spaces-rate-limit.ts).
# The Workers Rate Limiting binding was live-tested 2026-09-09 and never denied
# over-limit traffic (documented as permissive/eventually-consistent), so it is
# intentionally not bound here.
